name: PR 990 complete verification
on:
  push:
    branches: [qa/pr-990-hardening-20261009]
    paths: [.github/workflows/pr990-full-history-verification.yml]
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f971f9c17c98ab0b12e71097e146f0b21e33586e
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            11
            17
            21
            25
          mvn-toolchain-id: |
            JavaSE-1.8
            JavaSE-11
            JavaSE-17
            JavaSE-21
            JavaSE-25
      - name: Make required test runtimes discoverable
        run: |
          echo "NON_MODULAR_JAVA_HOME=$JAVA_HOME_8_X64" >> "$GITHUB_ENV"
          sudo mkdir -p /opt/tools/java/openjdk
          sudo ln -s "$JAVA_HOME_11_X64" /opt/tools/java/openjdk/jdk-11
          sudo ln -s "$JAVA_HOME_17_X64" /opt/tools/java/openjdk/jdk-17
          sudo ln -s "$JAVA_HOME_21_X64" /opt/tools/java/openjdk/jdk-21
      - uses: actions/setup-java@v6
        with:
          distribution: oracle-openjdk
          java-version: '27'
          mvn-toolchain-id: JavaSE-27
          cache: maven
      - name: Pin Maven and prepare display
        run: |
          url=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz
          curl -fsSL --retry 2 "$url" -o "$RUNNER_TEMP/maven.tar.gz"
          curl -fsSL --retry 2 "$url.sha512" -o "$RUNNER_TEMP/maven.sha512"
          echo "$(cat "$RUNNER_TEMP/maven.sha512")  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
          tar xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgtk-3-0 libasound2t64
      - name: Run the full reactor without test exclusions or relaxed gates
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD HEAD^{tree} > evidence/revision.txt
          git rev-parse --is-shallow-repository > evidence/shallow.txt
          git log -1 --format='%H %cI' -- org.eclipse.jdt.launching.ui.macosx > evidence/macosx-last-change.txt
          mvn -version > evidence/maven-version.txt
          cat "$JAVA_HOME/release" > evidence/jdk-release.txt
          set +e
          xvfb-run -a mvn -B -ntp -e clean verify --fail-at-end -Ptest-on-javase-27 -Pbree-libs -Papi-check -Pjavadoc -Dmaven.test.failure.ignore=false -Dcompare-version-with-baselines.skip=false -DDetectVMInstallationsJob.disabled=true -DtrimStackTrace=false -Dtycho.debug.artifactcomparator=true > evidence/maven.log 2>&1
          code=$?
          set -e
          echo "$code" > evidence/exit-code.txt
          tail -n 180 evidence/maven.log
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET,json,shutil
          out=pathlib.Path('evidence');cases=[];totals={'tests':0,'failures':0,'errors':0,'skipped':0}
          for p in pathlib.Path('.').glob('*/target/surefire-reports/TEST-*.xml'):
              shutil.copy(p,out/p.name);root=ET.parse(p).getroot()
              for k in totals:totals[k]+=int(root.attrib.get(k,0))
              for c in root.iter('testcase'):
                  f=c.find('failure');f=f if f is not None else c.find('error')
                  cases.append({'class':c.attrib.get('classname'),'name':c.attrib['name'],'failure':None if f is None else f.attrib.get('message','')})
          for i,p in enumerate(pathlib.Path('.').glob('*/target/work/data/.metadata/.log')):shutil.copy(p,out/f'eclipse-{i}.log')
          for i,p in enumerate(pathlib.Path('.').glob('*/target/compilelogs/*.xml')):shutil.copy(p,out/f'compile-{i}.xml')
          for i,p in enumerate(pathlib.Path('.').glob('*/target/apianalysis/*.xml')):shutil.copy(p,out/f'api-{i}.xml')
          result={'totals':totals,'cases':cases};(out/'test-results.json').write_text(json.dumps(result,indent=2));print(json.dumps(totals))
          failures=[c for c in cases if c['failure'] is not None];print(json.dumps(failures,indent=2))
          assert totals['tests']>1200,totals
          expected={'testClassPrepareBreakpointRemovalAfterMarkerIsDetached','testMarkerDeletionCleansTargetAndAllowsReplacementBreakpoint','testCleanupContinuesAfterRequestDeregistrationFailure','testLineBreakpointRemovalAfterMarkerIsDetached'}
          assert expected<={c['name'] for c in cases},'Missing breakpoint regressions'
          assert not failures,failures
          assert int((out/'exit-code.txt').read_text())==0,'Maven verification failed; inspect full log'
          changed=('BreakpointRemovalTests.java','GlobalBreakpointListener.java','VMStartupCleanupTest.java')
          seen=set()
          for p in out.glob('compile-*.xml'):
              for source in ET.parse(p).getroot().iter('source'):
                  path=source.attrib.get('path','')
                  if path.endswith(changed):
                      seen.add(path.rsplit('/',1)[-1]);assert not list(source.iter('problem')),source.attrib
          assert seen==set(changed),seen
          (out/'verification.json').write_text(json.dumps({'verified':True,'totals':totals,'warning_free_changed_test_files':sorted(seen)},indent=2))
          PY
      - name: Preserve complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr990-complete-verification
          path: evidence/
          retention-days: 14
