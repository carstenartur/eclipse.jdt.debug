name: CI environment evidence
on:
  workflow_dispatch:
  push:
    branches: [ci/jenkins-parity-diagnostics]
    paths: [.github/workflows/ci-environment-evidence.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify archived official OpenJDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          image='openjdk:26-ea-34-jdk-slim-bookworm'
          docker pull "$image" 2>&1 | tee evidence/docker-pull.txt
          docker image inspect "$image" > evidence/docker-image.json
          home=$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$image" | sed -n 's/^JAVA_HOME=//p')
          test -n "$home"
          cid=$(docker create "$image")
          trap 'docker rm "$cid" >/dev/null' EXIT
          mkdir -p /tmp/pinned-jdk
          docker cp "$cid:$home/." /tmp/pinned-jdk/
          /tmp/pinned-jdk/bin/java -XshowSettings:properties -version 2>&1 | tee evidence/java-version.txt
          grep -Eq 'java.runtime.version = 26-ea\+34([[:space:]]|$)' evidence/java-version.txt
          sha256sum /tmp/pinned-jdk/bin/java /tmp/pinned-jdk/lib/modules > evidence/jdk-files.sha256
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-environment-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error
