name: Verify breakpoint cleanup fix

on:
  push:
    branches:
      - automation/verify-breakpoint-fix-990

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 8 test VM
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Remember Java 8 home
        shell: bash
        run: echo "NON_MODULAR_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Java 26 build VM
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
          mvn-toolchain-id: JavaSE-26
          mvn-toolchain-vendor: temurin

      - name: Add regression test
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise RuntimeError(f"Expected exactly one {label}, found {text.count(old)}")
              return text.replace(old, new, 1)

          path = Path("org.eclipse.jdt.debug.tests/tests/org/eclipse/jdt/debug/tests/breakpoints/JavaBreakpointListenerTests.java")
          text = path.read_text(encoding="utf-8")
          text = replace_once(text,
              " *  Copyright (c) 2000, 2015 IBM Corporation and others.",
              " *  Copyright (c) 2000, 2026 IBM Corporation and others.",
              "test copyright")
          text = replace_once(text,
              "import org.eclipse.core.resources.IWorkspaceRunnable;",
              "import org.eclipse.core.resources.IMarker;\nimport org.eclipse.core.resources.IWorkspaceRunnable;",
              "IMarker import")
          text = replace_once(text,
              "import org.eclipse.debug.core.DebugException;",
              "import org.eclipse.debug.core.DebugException;\nimport org.eclipse.debug.core.model.IBreakpoint;",
              "IBreakpoint import")
          text = replace_once(text,
              "import org.eclipse.jdt.debug.tests.AbstractDebugTest;",
              "import org.eclipse.jdt.debug.tests.AbstractDebugTest;\nimport org.eclipse.jdt.internal.debug.core.model.JDIDebugTarget;",
              "JDIDebugTarget import")

          insertion_point = "\n\t/**\n\t * Tests a breakpoint listener extension gets removal notification when the underlying\n\t * marker is deleted.\n\t */\n\tpublic void testRemovedNotification() throws Exception {"
          addition = r'''

	private static boolean containsByIdentity(IBreakpoint[] breakpoints, IBreakpoint expected) {
		for (IBreakpoint breakpoint : breakpoints) {
			if (breakpoint == expected) {
				return true;
			}
		}
		return false;
	}

	private static boolean containsByIdentity(List<IBreakpoint> breakpoints, IBreakpoint expected) {
		synchronized (breakpoints) {
			for (IBreakpoint breakpoint : breakpoints) {
				if (breakpoint == expected) {
					return true;
				}
			}
		}
		return false;
	}

	/**
	 * Tests that a breakpoint without an associated marker is completely removed
	 * from a debug target and its suspended thread.
	 */
	public void testRemovalWithoutMarker() throws Exception {
		String typeName = "HitCountLooper";
		IJavaLineBreakpoint bp = createLineBreakpoint(17, typeName);
		IJavaThread thread = null;
		IMarker marker = null;
		try {
			thread = launchToLineBreakpoint(typeName, bp);
			JDIDebugTarget target = (JDIDebugTarget) thread.getDebugTarget();
			assertTrue("Breakpoint should be installed in the debug target",
					containsByIdentity(target.getBreakpoints(), bp));
			assertTrue("Breakpoint should be current in the suspended thread",
					containsByIdentity(thread.getBreakpoints(), bp));

			marker = bp.getMarker();
			try {
				bp.setMarker(null);
			} catch (CoreException e) {
				// Expected: reconfiguration cannot complete without a marker.
			}
			assertNull("Breakpoint should no longer have an associated marker", bp.getMarker());

			target.breakpointRemoved(bp, null);

			assertFalse("Stale breakpoint remained in the debug target",
					containsByIdentity(target.getBreakpoints(), bp));
			assertFalse("Stale breakpoint remained in the suspended thread",
					containsByIdentity(thread.getBreakpoints(), bp));
		} finally {
			if (bp.getMarker() == null && marker != null) {
				bp.setMarker(marker);
			}
			terminateAndRemove(thread);
			removeAllBreakpoints();
		}
	}
'''
          text = replace_once(text, insertion_point, addition + insertion_point, "test insertion point")
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Verify that the regression test fails without the fix
        shell: bash
        run: |
          set +e
          xvfb-run -a mvn clean verify --batch-mode --fail-at-end \
            -pl org.eclipse.jdt.debug.tests -am \
            -Ptest-on-javase-26 -Pbree-libs \
            -Dtest=JavaBreakpointListenerTests#testRemovalWithoutMarker \
            -Dcompare-version-with-baselines.skip=true \
            -Dproject.build.sourceEncoding=UTF-8 \
            -DDetectVMInstallationsJob.disabled=true \
            -DtrimStackTrace=false > /tmp/negative-control.log 2>&1
          result=$?
          set -e
          cat /tmp/negative-control.log
          if [ "$result" -eq 0 ]; then
            echo "Regression test unexpectedly passed without the production fix."
            exit 1
          fi
          if ! grep -Eq "JavaBreakpoint\.deregisterRequest|JDIThread\.removeCurrentBreakpoint|Breakpoint\.equals" /tmp/negative-control.log; then
            echo "Negative control failed for an unrelated reason."
            exit 1
          fi

      - name: Apply production fix
        shell: bash
        run: |
          git reset --hard HEAD
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(f"Expected exactly one {label}, found {text.count(old)}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = "org.eclipse.jdt.debug.tests/tests/org/eclipse/jdt/debug/tests/breakpoints/JavaBreakpointListenerTests.java"
          test = Path(test_path)
          text = test.read_text(encoding="utf-8")
          replacements = [
              (" *  Copyright (c) 2000, 2015 IBM Corporation and others.",
               " *  Copyright (c) 2000, 2026 IBM Corporation and others.", "test copyright"),
              ("import org.eclipse.core.resources.IWorkspaceRunnable;",
               "import org.eclipse.core.resources.IMarker;\nimport org.eclipse.core.resources.IWorkspaceRunnable;", "IMarker import"),
              ("import org.eclipse.debug.core.DebugException;",
               "import org.eclipse.debug.core.DebugException;\nimport org.eclipse.debug.core.model.IBreakpoint;", "IBreakpoint import"),
              ("import org.eclipse.jdt.debug.tests.AbstractDebugTest;",
               "import org.eclipse.jdt.debug.tests.AbstractDebugTest;\nimport org.eclipse.jdt.internal.debug.core.model.JDIDebugTarget;", "JDIDebugTarget import"),
          ]
          for old, new, label in replacements:
              if text.count(old) != 1:
                  raise RuntimeError(f"Expected exactly one {label}, found {text.count(old)}")
              text = text.replace(old, new, 1)
          insertion_point = "\n\t/**\n\t * Tests a breakpoint listener extension gets removal notification when the underlying\n\t * marker is deleted.\n\t */\n\tpublic void testRemovedNotification() throws Exception {"
          addition = r'''

	private static boolean containsByIdentity(IBreakpoint[] breakpoints, IBreakpoint expected) {
		for (IBreakpoint breakpoint : breakpoints) {
			if (breakpoint == expected) {
				return true;
			}
		}
		return false;
	}

	private static boolean containsByIdentity(List<IBreakpoint> breakpoints, IBreakpoint expected) {
		synchronized (breakpoints) {
			for (IBreakpoint breakpoint : breakpoints) {
				if (breakpoint == expected) {
					return true;
				}
			}
		}
		return false;
	}

	/**
	 * Tests that a breakpoint without an associated marker is completely removed
	 * from a debug target and its suspended thread.
	 */
	public void testRemovalWithoutMarker() throws Exception {
		String typeName = "HitCountLooper";
		IJavaLineBreakpoint bp = createLineBreakpoint(17, typeName);
		IJavaThread thread = null;
		IMarker marker = null;
		try {
			thread = launchToLineBreakpoint(typeName, bp);
			JDIDebugTarget target = (JDIDebugTarget) thread.getDebugTarget();
			assertTrue("Breakpoint should be installed in the debug target",
					containsByIdentity(target.getBreakpoints(), bp));
			assertTrue("Breakpoint should be current in the suspended thread",
					containsByIdentity(thread.getBreakpoints(), bp));

			marker = bp.getMarker();
			try {
				bp.setMarker(null);
			} catch (CoreException e) {
				// Expected: reconfiguration cannot complete without a marker.
			}
			assertNull("Breakpoint should no longer have an associated marker", bp.getMarker());

			target.breakpointRemoved(bp, null);

			assertFalse("Stale breakpoint remained in the debug target",
					containsByIdentity(target.getBreakpoints(), bp));
			assertFalse("Stale breakpoint remained in the suspended thread",
					containsByIdentity(thread.getBreakpoints(), bp));
		} finally {
			if (bp.getMarker() == null && marker != null) {
				bp.setMarker(marker);
			}
			terminateAndRemove(thread);
			removeAllBreakpoints();
		}
	}
'''
          if text.count(insertion_point) != 1:
              raise RuntimeError(f"Expected one test insertion point, found {text.count(insertion_point)}")
          test.write_text(text.replace(insertion_point, addition + insertion_point, 1), encoding="utf-8")

          replace_once(
              "org.eclipse.jdt.debug/model/org/eclipse/jdt/internal/debug/core/breakpoints/JavaBreakpoint.java",
              "if (!(request instanceof ClassPrepareRequest) && getMarker().exists()) {",
              "if (!(request instanceof ClassPrepareRequest) && markerExists()) {",
              "JavaBreakpoint marker guard")
          replace_once(
              "org.eclipse.jdt.debug/model/org/eclipse/jdt/internal/debug/core/breakpoints/JavaClassPrepareBreakpoint.java",
              "if (getMarker().exists()) {",
              "if (markerExists()) {",
              "JavaClassPrepareBreakpoint marker guard")

          target_path = "org.eclipse.jdt.debug/model/org/eclipse/jdt/internal/debug/core/model/JDIDebugTarget.java"
          old_target = '''\t@Override
\tpublic void breakpointRemoved(IBreakpoint breakpoint, IMarkerDelta delta) {
\t\tif (!isAvailable()) {
\t\t\treturn;
\t\t}
\t\tif (supportsBreakpoint(breakpoint)) {
\t\t\ttry {
\t\t\t\t((JavaBreakpoint) breakpoint).removeFromTarget(this);
\t\t\t\tgetBreakpoints().remove(breakpoint);
\t\t\t\tIterator<JDIThread> threads = getThreadIterator();
\t\t\t\twhile (threads.hasNext()) {
\t\t\t\t\tthreads.next()
\t\t\t\t\t\t\t.removeCurrentBreakpoint(breakpoint);
\t\t\t\t}
\t\t\t} catch (CoreException e) {
\t\t\t\tlogError(e);
\t\t\t}
\t\t}
\t}
'''
          new_target = '''\t@Override
\tpublic void breakpointRemoved(IBreakpoint breakpoint, IMarkerDelta delta) {
\t\tif (!isAvailable()) {
\t\t\treturn;
\t\t}
\t\t// A removal notification can arrive after the marker is no longer
\t\t// available. Use the target's installed state instead of marker data.
\t\tboolean installed = false;
\t\tsynchronized (fBreakpoints) {
\t\t\tfor (IBreakpoint installedBreakpoint : fBreakpoints) {
\t\t\t\tif (installedBreakpoint == breakpoint) {
\t\t\t\t\tinstalled = true;
\t\t\t\t\tbreak;
\t\t\t\t}
\t\t\t}
\t\t}
\t\tif (installed) {
\t\t\ttry {
\t\t\t\t((JavaBreakpoint) breakpoint).removeFromTarget(this);
\t\t\t} catch (CoreException e) {
\t\t\t\tlogError(e);
\t\t\t} finally {
\t\t\t\tsynchronized (fBreakpoints) {
\t\t\t\t\tfBreakpoints.removeIf(installedBreakpoint -> installedBreakpoint == breakpoint);
\t\t\t\t}
\t\t\t\tIterator<JDIThread> threads = getThreadIterator();
\t\t\t\twhile (threads.hasNext()) {
\t\t\t\t\tthreads.next().removeCurrentBreakpoint(breakpoint);
\t\t\t\t}
\t\t\t}
\t\t}
\t}
'''
          replace_once(target_path, old_target, new_target, "JDIDebugTarget removal method")

          replace_once(
              "org.eclipse.jdt.debug/model/org/eclipse/jdt/internal/debug/core/model/JDIThread.java",
              "\t\t\tfCurrentBreakpoints.remove(bp);",
              "\t\t\tfCurrentBreakpoints.removeIf(breakpoint -> breakpoint == bp);",
              "JDIThread identity removal")
          replace_once(
              "org.eclipse.jdt.debug/META-INF/MANIFEST.MF",
              "Bundle-Version: 3.26.100.qualifier",
              "Bundle-Version: 3.26.200.qualifier",
              "bundle version")
          PY
          git diff --check

      - name: Verify the fixed regression test
        shell: bash
        run: |
          xvfb-run -a mvn verify --batch-mode --fail-at-end \
            -pl org.eclipse.jdt.debug.tests -am \
            -Ptest-on-javase-26 -Pbree-libs \
            -Dtest=JavaBreakpointListenerTests#testRemovalWithoutMarker \
            -Dcompare-version-with-baselines.skip=true \
            -Dproject.build.sourceEncoding=UTF-8 \
            -DDetectVMInstallationsJob.disabled=true \
            -DtrimStackTrace=false
          git diff --check

      - name: Store verified source changes on the isolated branch
        shell: bash
        run: |
          git config user.name "Verification Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            org.eclipse.jdt.debug.tests/tests/org/eclipse/jdt/debug/tests/breakpoints/JavaBreakpointListenerTests.java \
            org.eclipse.jdt.debug/META-INF/MANIFEST.MF \
            org.eclipse.jdt.debug/model/org/eclipse/jdt/internal/debug/core/breakpoints/JavaBreakpoint.java \
            org.eclipse.jdt.debug/model/org/eclipse/jdt/internal/debug/core/breakpoints/JavaClassPrepareBreakpoint.java \
            org.eclipse.jdt.debug/model/org/eclipse/jdt/internal/debug/core/model/JDIDebugTarget.java \
            org.eclipse.jdt.debug/model/org/eclipse/jdt/internal/debug/core/model/JDIThread.java
          git commit -m "Store verified breakpoint cleanup fix"
          git push origin HEAD:"${GITHUB_REF_NAME}"
