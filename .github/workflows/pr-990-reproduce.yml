name: PR 990 isolated reproduction
on:
  push:
    branches: [diagnostics/pr-990-ci-20260929]
    paths: [.github/workflows/pr-990-reproduce.yml]
permissions:
  contents: read
jobs:
  reproduce:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: breakpoint-only-27
            ref: 9ea93a87f617178d82a6fd61de7a9afa0ea98f5b
            test: BreakpointRemovalTests
            timeout: 240
          - name: full-stacked-27
            ref: 9ea93a87f617178d82a6fd61de7a9afa0ea98f5b
            test: AutomatedSuite
            timeout: 600
          - name: full-upstream-27
            ref: 4e7cd73a7bac28514212c3402adab6610336d4b2
            test: AutomatedSuite
            timeout: 600
    steps:
      - name: Install non-modular test JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          mvn-toolchain-id: JavaSE-1.8
      - name: Preserve Java 8 location
        run: echo "NON_MODULAR_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Install test runtime JDK
        uses: actions/setup-java@v6
        with:
          distribution: oracle-openjdk
          java-version: '27'
          mvn-toolchain-id: JavaSE-27
      - name: Obtain the exact source revision
        env:
          SOURCE_REF: ${{ matrix.ref }}
        run: |
          git init source
          git -C source remote add origin https://github.com/carstenartur/eclipse.jdt.debug.git
          git -C source fetch --depth=1 origin "$SOURCE_REF"
          git -C source checkout --detach FETCH_HEAD
          git -C source status --short
          git -C source rev-parse HEAD
          java -version
          mvn -version
          cat "$JAVA_HOME/release"
          cat ~/.m2/toolchains.xml
      - name: Prepare X display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgtk-3-0 libasound2t64
      - name: Run tests with periodic thread dumps
        env:
          TEST_PATTERN: ${{ matrix.test }}
          TEST_TIMEOUT: ${{ matrix.timeout }}
        shell: bash
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import os, pathlib, subprocess, time
          out = pathlib.Path('evidence').resolve()
          command = ['xvfb-run', '-a', 'mvn', '-B', '-ntp', 'clean', 'verify', '-pl', 'org.eclipse.jdt.debug.tests', '-am', '-Ptest-on-javase-27', '-Pbree-libs', '-Dtest=' + os.environ['TEST_PATTERN'], '-DfailIfNoTests=false', '-Dsurefire.timeout=' + os.environ['TEST_TIMEOUT'], '-Dmaven.test.failure.ignore=false', '-Dcompare-version-with-baselines.skip=false', '-DDetectVMInstallationsJob.disabled=true', '-DtrimStackTrace=false']
          print('COMMAND:', ' '.join(command), flush=True)
          with (out/'maven.log').open('w') as log:
              process = subprocess.Popen(command, cwd='source', stdout=log, stderr=subprocess.STDOUT)
              start = time.monotonic()
              count = 0
              while process.poll() is None:
                  time.sleep(30)
                  count += 1
                  lines = (out/'maven.log').read_text(errors='replace').splitlines()
                  print('PROGRESS', int(time.monotonic()-start), 'seconds; tail:', flush=True)
                  print('\n'.join(lines[-18:]), flush=True)
                  if count % 2:
                      continue
                  ps = subprocess.run(['ps', '-eo', 'pid,args'], capture_output=True, text=True, check=True)
                  for line in ps.stdout.splitlines():
                      if 'org.eclipse.tycho.surefire.osgibooter.uitest' not in line or 'bin/java' not in line:
                          continue
                      pid = line.strip().split()[0]
                      try:
                          dump = subprocess.run([os.environ['JAVA_HOME']+'/bin/jcmd', pid, 'Thread.print', '-l'], capture_output=True, text=True, timeout=12)
                          text = dump.stdout + dump.stderr
                          (out/f'threads-{count}-{pid}.txt').write_text(text)
                          print('THREAD DUMP', pid, '\n' + '\n'.join(text.splitlines()[:110]), flush=True)
                          if 'deadlock' in text.lower():
                              print('DEADLOCK SECTION\n'+'\n'.join(text.splitlines()[-150:]), flush=True)
                      except subprocess.TimeoutExpired:
                          print('jcmd timed out for', pid, flush=True)
              result = process.returncode
          print('MAVEN EXIT', result, flush=True)
          print('\n'.join((out/'maven.log').read_text(errors='replace').splitlines()[-220:]), flush=True)
          for index, path in enumerate(pathlib.Path('source').glob('**/.metadata/.log')):
              text = path.read_text(errors='replace')
              (out/f'eclipse-{index}.log').write_text(text)
              print('ECLIPSE LOG', str(path), '\n'+text[-100000:], flush=True)
          for path in pathlib.Path('source').glob('**/surefire-reports/*.xml'):
              print('TEST REPORT', str(path), path.read_text(errors='replace')[:1800], flush=True)
          (out/'exit-code.txt').write_text(str(result))
          raise SystemExit(result)
          PY
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.name }}
          path: evidence/
          retention-days: 7
