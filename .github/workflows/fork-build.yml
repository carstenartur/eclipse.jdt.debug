name: Fork Build (CodeQL)
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '20 9 * * 2'
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install legacy JDK for the shared toolchain
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8.0.482+8'
      - name: Install the same Java and Maven tools as the full CI
        shell: bash
        run: |
          set -euo pipefail
          bash .github/ci/prepare-tools.sh "$RUNNER_TEMP/tools" "$RUNNER_TEMP/tool-evidence"
          bash .github/ci/activate-tools.sh "$RUNNER_TEMP/tools" "$GITHUB_WORKSPACE/.."
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
      - name: Build for CodeQL (the separate Maven CI performs full verification)
        run: mvn -B package -Pbuild-individual-bundles --file pom.xml
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        env:
          CODEQL_ACTION_EXTRA_OPTIONS: '{"database":{"interpret-results":["--max-paths", 1]}}'
      - name: Archive tool versions and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-tool-evidence
          path: ${{ runner.temp }}/tool-evidence/
          retention-days: 7
          if-no-files-found: warn
